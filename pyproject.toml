[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wacloud"
version = "0.1.0"
description = "Cliente limpio y stateless para la WhatsApp Cloud API de Meta (envío, plantillas, webhooks, medios)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["wacloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
